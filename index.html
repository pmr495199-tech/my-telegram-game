<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Головне Меню</title>
    <!-- SDK Telegram Web App -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #121212);
            color: var(--tg-theme-text-color, #ffffff);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            min-height: 100vh;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-top: 30px;
        }

        .title {
            font-size: 32px;
            font-weight: 800;
            margin-bottom: 8px;
            color: var(--tg-theme-button-color, #0088cc);
        }

        .user-info {
            font-size: 16px;
            opacity: 0.8;
        }

        .menu-container {
            width: 100%;
            max-width: 320px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 40px;
        }

        .btn {
            width: 100%;
            padding: 16px;
            font-size: 18px;
            font-weight: 700;
            border: none;
            border-radius: 14px;
            cursor: pointer;
            transition: transform 0.1s ease, opacity 0.2s;
            text-align: center;
        }

        .btn-primary {
            background-color: var(--tg-theme-button-color, #0088cc);
            color: var(--tg-theme-button-text-color, #ffffff);
            box-shadow: 0 4px 15px rgba(0, 136, 204, 0.4);
        }

        .btn-secondary {
            background-color: var(--tg-theme-secondary-bg-color, #1e1e1e);
            color: var(--tg-theme-text-color, #ffffff);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .btn:active {
            transform: scale(0.96);
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1 class="title">МОЯ ГРА</h1>
        <p class="user-info" id="user-greeting">Вітаємо у грі!</p>
    </div>

    <div class="menu-container">
        <button class="btn btn-primary" onclick="playGame()">🎮 ГРАТИ</button>
        <button class="btn btn-secondary" onclick="openLeaderboard()">🏆 РЕКОРДИ</button>
        <button class="btn btn-secondary" onclick="openSettings()">⚙️ НАЛАШТУВАННЯ</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        // Отримання імені користувача з Telegram
        const user = tg.initDataUnsafe?.user;
        if (user) {
            document.getElementById('user-greeting').innerText = `Гравець: ${user.first_name}`;
        }

        function triggerVibration() {
            if (tg.HapticFeedback) {
                tg.HapticFeedback.impactOccurred('medium');
            }
        }

        function playGame() {
            triggerVibration();
            alert('Тут запускатиметься ігровий процес!');
        }

        function openLeaderboard() {
            triggerVibration();
            alert('Розділ "Рекорди" в розробці');
        }

        function openSettings() {
            triggerVibration();
            alert('Розділ "Налаштування" в розробці');
        }
    </script>
</body>
</html>
